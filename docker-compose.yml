services:
  db:
    image: postgres:16
    container_name: store_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - assistant_network
  
  mcp_server:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mcp
    container_name: mcp_server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - db
    networks:
      - assistant_network
  
  backend_api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: backend_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - MCP_SERVER_URL=http://mcp_server:8080/sse 
    depends_on:
      - mcp_server
    networks:
      - assistant_network

  ui:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ui
    container_name: ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_HOST=backend_api
      - API_PORT=8000
    depends_on:
      - backend_api
    networks:
      - assistant_network

volumes:
  postgres_data:

networks:
  assistant_network:
    driver: bridge